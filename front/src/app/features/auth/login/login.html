<div class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="auth-header">
      <a routerLink="/" class="auth-logo">NORTH <span>PROD</span></a>
      <h1>Connexion</h1>
      <p>Accédez à votre espace artiste</p>
    </div>

    @if(error) {
      <div class="auth-alert error">
        <i class="fa fa-exclamation-circle"></i> {{ error }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-field" [class.has-error]="email.invalid && email.touched">
        <label>Adresse email</label>
        <input type="email" formControlName="email" placeholder="votre@email.com" autocomplete="email" />
        @if(email.invalid && email.touched) {
          <span class="field-error">Email invalide</span>
        }
      </div>

      <div class="form-field" [class.has-error]="password.invalid && password.touched">
        <label>Mot de passe</label>
        <div class="input-group">
          <input [type]="showPass ? 'text' : 'password'" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="toggle-pass" (click)="showPass = !showPass">
            <i [class]="showPass ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
          </button>
        </div>
        @if(password.invalid && password.touched) {
          <span class="field-error">Mot de passe requis</span>
        }
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Se souvenir de moi</span>
        </label>
        <a routerLink="/auth/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="btn-auth" [disabled]="loading">
        @if(loading) { <i class="fa fa-spinner fa-spin"></i> Connexion... }
        @else { <span>Se connecter</span> <i class="fa fa-arrow-right"></i> }
      </button>
    </form>

    <div class="auth-footer">
      Pas encore de compte ?
      <a routerLink="/auth/register">Créer un compte artiste</a>
    </div>
  </div>
</div>
