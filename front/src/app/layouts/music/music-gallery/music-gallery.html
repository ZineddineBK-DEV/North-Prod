<section class="np-gallery">
  <div class="gallery-header container">
    <span class="section-tag">Galerie</span>
    <h2 class="section-title">Le Studio en <span class="gold">Images</span></h2>
  </div>
  <div class="gallery-strip">
    @for(img of images; track img.alt) {
      <div class="gallery-cell" [style.background-image]="'url(' + img.src + ')'">
        <div class="cell-overlay"><i class="fa fa-expand"></i></div>
      </div>
    }
  </div>
</section>
